name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"
          
          
          
      - name: Isolate SKILL-ISSUE from the root Service Worker
        env:
          SITE_DIR: "_site${{ steps.pages.outputs.base_path }}"
        run: |
          worker="$SITE_DIR/sw.min.js"
          test -s "$worker"
          grep -Fq '/skill-issue' "$SITE_DIR/assets/js/data/swconf.js"
          cat tools/skill-issue-sw-guard.js "$worker" > "$worker.tmp"
          mv "$worker.tmp" "$worker"
          node --check "$worker"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
             --disable-external \
             --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Service Worker isolation
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://avhiram.github.io/sw.min.js?revision=${GITHUB_SHA}" -o /tmp/published-sw.js && grep -Fq 'skillIssueCacheIsolation' /tmp/published-sw.js; then
              echo 'Published root Service Worker includes SKILL-ISSUE cache isolation.'
              exit 0
            fi
            sleep 10
          done
          echo '::error::Published root Service Worker isolation not verified.'
          exit 1
